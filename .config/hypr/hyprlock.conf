general
{
    hide_cursor = true
    ignore_empty_input = true
}

background
{
    monitor =
    path = /home/zelay/Pictures/Wallpapers/Wallpaper2.jpg
    blur_passes = 3
    color = rgba(21, 21, 21, 0.7)
}

label
{
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label
{
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(245, 194, 231, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field
{
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(245, 194, 231, 1.0)
    inner_color = rgba(28, 28, 28, 0.8)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">Введите пароль...</span>
    position = 0, -50
    halign = center
    valign = center
}
